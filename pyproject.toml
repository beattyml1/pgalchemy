[tool.poetry]
name = "pgalchemy"
version = "0.2.0"
description = "SQLAlchemy and Alembic support for PostgreSQL features like RLS, Policies, CLS, Config, Views, Functions, Domains, etc"
authors = ["Matthew Beatty <beattyml1@gmail.com>"]
readme = "README.md"
homepage = "https://github.com/beattyml1/pgalchemy"
repository = "https://github.com/beattyml1/pgalchemy"
include = [{path="README.md"}, {path="LICENSE"}]
packages = [
    { include = "pgalchemy", from = "." },
]

[tool.poetry.dependencies]
python = "^3.11"
sqlalchemy = "^2.0.32"
alembic = "^1.13.2"
alembic-utils = "^0.8.4"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
pytest-snapshot = "^0.9.0"
psycopg2-binary = "^2.9.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
# alembic/versions holds generated migration scripts, not tests.
norecursedirs = ["alembic", ".venv", "build", "dist"]
markers = [
    "integration: requires a live PostgreSQL (see docker-compose.yml)",
]
